name: Update Ei Compendex source list

on:
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and convert Compendex source list
        run: python3 EI/update_compendex.py

      - name: Commit updated snapshot
        shell: bash
        run: |
          if git diff --quiet -- EI/compendex_journals.csv EI/compendex_serials.csv EI/source_url.txt; then
            echo "Compendex source list is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EI/compendex_journals.csv EI/compendex_serials.csv EI/source_url.txt
          git commit -m "update Ei Compendex source list"
          git push
